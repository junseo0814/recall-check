<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecallCheck — AI 리콜 위험도 진단</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Malgun Gothic', sans-serif; background: #f4f6f9; color: #333; }
    header { background: #1F497D; color: white; padding: 20px 40px; }
    header h1 { font-size: 24px; }
    header p { font-size: 13px; opacity: 0.8; margin-top: 4px; }
    .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .card { background: white; border-radius: 10px; padding: 30px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card h2 { font-size: 16px; color: #1F497D; margin-bottom: 20px; border-bottom: 2px solid #1F497D; padding-bottom: 10px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 13px; font-weight: bold; color: #555; }
    .form-group input, .form-group select {
      padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px;
      font-size: 14px; font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none; border-color: #1F497D;
    }
    .btn {
      width: 100%; margin-top: 20px; padding: 14px;
      background: #1F497D; color: white; border: none;
      border-radius: 6px; font-size: 16px; font-weight: bold;
      cursor: pointer; font-family: inherit;
    }
    .btn:hover { background: #163a63; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }
    .result-box { display: none; }
    .verdict-badge {
      display: inline-block; padding: 8px 20px; border-radius: 20px;
      font-size: 20px; font-weight: bold; margin-bottom: 12px;
    }
    .verdict-위험 { background: #fde8e8; color: #c0392b; }
    .verdict-주의 { background: #fef9e7; color: #d35400; }
    .verdict-안전 { background: #e8f8f0; color: #1e8449; }
    .explanation { font-size: 14px; line-height: 1.7; color: #444; margin-bottom: 20px; }
    .match-item {
      border: 1px solid #eee; border-radius: 8px; padding: 14px;
      margin-bottom: 10px; background: #fafafa;
    }
    .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .match-name { font-weight: bold; font-size: 14px; }
    .score-badge {
      font-size: 12px; padding: 3px 10px; border-radius: 10px;
      background: #e8f0fb; color: #1F497D; font-weight: bold;
    }
    .match-detail { font-size: 13px; color: #666; line-height: 1.6; }
    .loading { text-align: center; padding: 30px; color: #888; display: none; }
  </style>
</head>
<body>
  <header>
    <h1>RecallCheck</h1>
    <p>AI 기반 온라인 판매 리콜 위험도 사전 진단 서비스</p>
  </header>

  <div class="container">
    <div class="card">
      <h2>상품 정보 입력</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>제품명 *</label>
          <input type="text" id="product_name" placeholder="예: 무선충전기 EP-P3300">
        </div>
        <div class="form-group">
          <label>브랜드</label>
          <input type="text" id="brand" placeholder="예: 삼성전자">
        </div>
        <div class="form-group">
          <label>모델명</label>
          <input type="text" id="model" placeholder="예: EP-P3300">
        </div>
        <div class="form-group">
          <label>카테고리</label>
          <select id="category">
            <option value="">선택</option>
            <option>전기용품</option>
            <option>가전제품</option>
            <option>어린이제품</option>
            <option>주방용품</option>
            <option>생활용품</option>
            <option>기타</option>
          </select>
        </div>
      </div>
      <button class="btn" onclick="checkRecall()">리콜 위험도 진단하기</button>
    </div>

    <div class="loading" id="loading">
      AI가 분석 중입니다...
    </div>

    <div class="card result-box" id="result">
      <h2>진단 결과</h2>
      <div id="verdict_badge"></div>
      <p class="explanation" id="explanation"></p>
      <h2 style="margin-top:16px">유사 리콜 제품 Top 3</h2>
      <div id="matches"></div>
    </div>
  </div>

  <script>
    async function checkRecall() {
      const product_name = document.getElementById('product_name').value.trim();
      if (!product_name) { alert('제품명을 입력해주세요'); return; }

      document.getElementById('loading').style.display = 'block';
      document.getElementById('result').style.display = 'none';
      document.querySelector('.btn').disabled = true;

      try {
        const res = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            product_name: document.getElementById('product_name').value,
            brand: document.getElementById('brand').value,
            model: document.getElementById('model').value,
            category: document.getElementById('category').value
          })
        });

        const data = await res.json();

        document.getElementById('verdict_badge').innerHTML =
          `<span class="verdict-badge verdict-${data.verdict}">${data.verdict}</span>`;
        document.getElementById('explanation').textContent = data.explanation;

        const matchesDiv = document.getElementById('matches');
        matchesDiv.innerHTML = data.top_matches.map(m => `
          <div class="match-item">
            <div class="match-header">
              <span class="match-name">${m.product_name}</span>
              <span class="score-badge">유사도 ${m.score}%</span>
            </div>
            <div class="match-detail">
              브랜드: ${m.brand} | 모델: ${m.model} | 리콜일: ${m.recall_date}<br>
              리콜 사유: ${m.reason}<br>
              조치사항: ${m.action}
            </div>
          </div>
        `).join('');

        document.getElementById('result').style.display = 'block';
      } catch(e) {
        alert('오류가 발생했습니다: ' + e.message);
      } finally {
        document.getElementById('loading').style.display = 'none';
        document.querySelector('.btn').disabled = false;
      }
    }
  </script>
</body>
</html>
